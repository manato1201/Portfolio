<title id="dg-t-site-architecture">制作物まとめサイトの構成 — Vercel に静的サイト、Cloudflare に名前解決とメディア</title>
<desc id="dg-d-site-architecture">content/works の markdown を Next.js がビルド時に静的な HTML にし、Vercel が配信する。動画は Cloudflare の R2 に置き、Range 対応の Worker で配信する。GitHub と他の制作物のデモへはリンクで出る。</desc>
